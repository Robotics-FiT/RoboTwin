# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
  # Override the head_camera vertical FOV (degrees). The D435 profile in
  # `_camera_config.yml` defaults to fovy=37 (fovx ~47 at 4:3), which is too
  # narrow to fit both arms in the "default" third_person_view. Bumping to 55
  # gives fovx ~68 at 320x240, enough to frame the full dual-arm workspace
  # from the head_camera's (-0.032, -0.45, 1.35) mount looking down at the
  # tabletop. Only affects head_camera; wrist cameras are unchanged.
  head_camera_fovy: 55
  head_camera_w: 1280
  head_camera_h: 720
  # Which view is used to render the final mp4 video.
  #   default  -> head_camera (first-person / wrist head)
  #   observer -> static third-person observer_camera (covers both arms)
  #   random   -> (reserved) randomised third-person camera for data augmentation
  third_person_view: default
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true

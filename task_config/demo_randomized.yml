# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.02
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.02
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
  # Override the head_camera vertical FOV (degrees). The D435 profile in
  # `_camera_config.yml` defaults to fovy=37 (fovx ~47 at 4:3), which is too
  # narrow to fit both arms in the "default" third_person_view. Bumping to 55
  # gives fovx ~68 at 320x240, enough to frame the full dual-arm workspace
  # from the head_camera's (-0.032, -0.45, 1.35) mount looking down at the
  # tabletop. Only affects head_camera; wrist cameras are unchanged.
  head_camera_fovy: 55
  # Override head_camera resolution (pixels). The D435 profile in
  # `_camera_config.yml` defaults to 320x240 and is shared by other tasks
  # plus `eval_policy*.py` / `policy/DP/train.py`, so we don't touch it
  # globally. These keys override the head_camera's render size *only* for
  # this task, giving 720P video without affecting wrist cameras, point
  # cloud cropping, or other configs.
  head_camera_w: 1280
  head_camera_h: 720
  # Override head_camera pose (position / forward / left in world coords).
  # The aloha-agilex embodiment defaults to forward=(0, 0.6, -0.8) which is
  # only ~53deg below horizontal -- that frames the tabletop nicely but
  # *cuts off* the rest pose, where both EEs end up almost directly under
  # the camera mount. Tilting forward to (0, 0.3, -0.9) gives ~71.6deg pitch
  # down: the lower edge of frame now reaches ~99deg (i.e. slightly behind
  # vertical), so the home/rest pose sits comfortably in frame. Position
  # and left are kept at embodiment defaults (commented out below); set
  # them only if you also want to relocate the mount.
  # head_camera_position: [-0.032, -0.45, 1.35]
  head_camera_forward: [0, 0.3, -0.9]
  # head_camera_left: [-1, 0, 0]
  # Which view is used to render the final mp4 video.
  #   default  -> head_camera (first-person / wrist head)
  #   observer -> static third-person observer_camera (covers both arms)
  #   random   -> (reserved) randomised third-person camera for data augmentation
  third_person_view: default
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true

hdri_sun_intensity: 10.0           # 想更亮的 key light
hdri_sun_min_elevation_deg: 35.0   # 想更"正午式"的阴影
hdri_sun_max_elevation_deg: 80.0   # 想封顶避免阴影太短
render_freq: 0
# Number of episodes collected per run. Lower this while debugging (e.g. 3),
# raise it (e.g. 50) when actually producing data for training.
episode_num: 100
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 0
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.1
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.05
  # Scene tweak (not a randomiser). Set to true to skip creating the back
  # wall, which gives third-person / augmentation cameras an unobstructed
  # view of the robot and tabletop.
  remove_wall: true

# Drop a large, tinted flat plane at z=0 so table/robot/objects cast visible
# shadows onto "the ground" even though the real background comes from the
# HDRI environment map. Colour is auto-sampled from the HDRI's horizon band
# so the plane blends with the HDRI's own ground (e.g. grass for the
# grasslands HDRI).
shadow_catcher: false
# Optional overrides:
# shadow_catcher_color: [0.28, 0.30, 0.18]   # explicit RGB in [0,1]
# shadow_catcher_size: 10.0                  # half-size of the square plane
# shadow_catcher_z_bias: 0.001               # lift above z=0 to dodge z-fighting
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
  # "default" -> head_camera, "observer" -> fixed third-person with the table
  # between camera and robot (great for demos/viz), "random" -> per-episode
  # random pose on a partial sphere around the tabletop (good for visual
  # augmentation).
  third_person_view: observer
  # Knobs for the random third-person view (only used when third_person_view == random).
  random_view:
    azimuth_range: [-90.0, 90.0]      # deg; 0 = robot front, +/-90 = robot side
    elevation_range: [15.0, 70.0]     # deg above horizon
    radius_range: [1.1, 1.8]          # metres from the tabletop centre
    look_at: [0.0, 0.0, 0.74]         # tabletop centre in world frame (z auto-biased)
    look_at_jitter: 0.05              # metres of uniform jitter on the look-at point
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
# Random-dance specific knobs (consumed by envs/random_dance.py).
# Larger `arm_delta` -> bigger dance amplitude; `hold_substeps` must also grow,
# otherwise each keyframe segment gets traversed too fast for the PD
# controller to follow smoothly. Playback uses a C^1 Catmull-Rom spline so
# consecutive segments are stitched seamlessly -- no settle phase, no
# start-stop-start-stop stutter.
random_dance:
  n_steps: 30
  arm_delta: 0.6        # radians (~34 deg) around home state per joint
  gripper_toggle_p: 0.2
  hold_substeps: 80     # physics substeps per keyframe segment
  save_every: 8         # save one observation every N substeps
  # Centre of the random joint sampling (task-level "dance home", independent of
  # the embodiment's homestate). Tweak so both arms spread open and face the
  # observer camera. Joint order: [j1 shoulder-yaw, j2 shoulder-pitch,
  # j3 elbow, j4, j5 wrist-pitch, j6]. Comment out to fall back to the
  # built-in defaults in envs/random_dance.py.
  left_home:  [ 0.30, 0.40, 0.80, 0.0, 0.80, 0.0]
  right_home: [-0.30, 0.40, 0.80, 0.0, 0.80, 0.0]

render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 0
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.1
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.05
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
  # Use the static third-person observer_camera for the rendered mp4.
  third_person_view: observer
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
# Random-dance specific knobs (consumed by envs/random_dance.py)
random_dance:
  n_steps: 30
  arm_delta: 0.35
  gripper_toggle_p: 0.3
  hold_substeps: 40
  save_every: 5
